<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chrysanths — The Company Profile</title>
<meta name="description" content="Company profile Chrysanths (Chrysanthindo): digital marketing, KOL management, dan konten sosial media untuk brand F&amp;B.">
<meta name="theme-color" content="#0050F0">
<meta property="og:title" content="Chrysanths — The Company Profile">
<meta property="og:description" content="Digital marketing, KOL management, dan konten sosial media untuk brand F&amp;B.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;0,6..96,900;1,6..96,500;1,6..96,700&family=Hanken+Grotesk:wght@400;500;700&display=swap">
<style>
:root{
  --stage:#E4E4DF; --paper:#FFFFFF; --ink:#111111; --muted:#5E5E59; --blue:#0050F0; --blueink:#0050F0; --rule:#111111; --tint:#EEF3FF;
  --display:'Bodoni Moda','Didot','Times New Roman',serif; --body:'Hanken Grotesk',system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--stage:#0A0A0A;--paper:#101010;--ink:#F4F4F0;--muted:#A9A9A2;--blueink:#7BA3FF;--rule:#F4F4F0;--tint:#14234D}
}
:root[data-theme="dark"]{--stage:#0A0A0A;--paper:#101010;--ink:#F4F4F0;--muted:#A9A9A2;--blueink:#7BA3FF;--rule:#F4F4F0;--tint:#14234D}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--stage);font-family:var(--body);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;overflow:hidden}
.book{position:relative;width:min(1120px,95vw);aspect-ratio:16/10;perspective:2600px}
.page{position:absolute;inset:0;background:var(--paper);transform-origin:left center;transition:transform .9s cubic-bezier(.6,.05,.25,1),opacity .35s .55s;box-shadow:0 24px 60px rgba(0,0,0,.28);display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.page.flipped{transform:rotateY(-100deg);opacity:0;pointer-events:none}
.col{padding:clamp(18px,3.4vw,46px);display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,1.4vw,18px);min-width:0;overflow:auto}
.ph{position:relative;min-height:0;overflow:hidden;background:#ccc}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:700;letter-spacing:-.02em;line-height:.98}
h2{font-size:clamp(30px,4.6vw,62px)}
h3{font-size:clamp(17px,1.9vw,26px);line-height:1.1}
p{margin:0;line-height:1.55;font-size:clamp(12px,1.08vw,14.5px)}
.drop::first-letter{font-family:var(--display);font-weight:900;float:left;font-size:4.1em;line-height:.8;padding:.06em .08em 0 0;color:var(--blueink)}
.fine{font-family:var(--display);font-style:italic;font-weight:500;color:var(--muted)}
.folio{position:absolute;left:clamp(14px,2vw,26px);bottom:10px;z-index:5;font-size:11px;letter-spacing:.12em;color:#fff;mix-blend-mode:difference;pointer-events:none}
/* cover */
.cover{display:block;color:#fff;background:#000}
.cover>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.cover::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.15) 62%),linear-gradient(0deg,rgba(0,0,0,.55),transparent 45%)}
.cover .logo{position:absolute;z-index:2;top:clamp(16px,3vw,40px);left:clamp(16px,3vw,40px);width:clamp(110px,15vw,190px);background:#fff;padding:0}
.cover h1{position:absolute;z-index:2;left:clamp(16px,3vw,40px);bottom:clamp(18px,3.4vw,44px);font-size:clamp(42px,8.4vw,118px);font-weight:900;line-height:.9;letter-spacing:-.03em}
.cover ul{position:absolute;z-index:2;right:clamp(16px,3vw,40px);bottom:clamp(18px,3.4vw,44px);margin:0;padding:0;list-style:none;text-align:right;font-family:var(--display);font-style:italic;font-size:clamp(14px,1.8vw,24px);line-height:1.5}
/* cover tipografi + lingkaran */
.cvr{display:block;container-type:size;background:#0050F0;color:#fff}
.cvr .c{position:absolute;border-radius:50%;aspect-ratio:1;display:block}
.cvr .k{width:56cqw;left:56cqw;top:-21cqw;background:#111}
.cvr .p{width:34cqw;left:74cqw;top:42cqw;background:#7FA6FF}
.cvr .r{width:34cqw;left:58cqw;top:17.25cqw;border:2px solid rgba(255,255,255,.75)}
.cvr .lg{width:26cqw;left:62cqw;top:21.25cqw;background:#fff;display:grid;place-items:center;overflow:hidden}
.cvr .lg img{width:74%;height:auto;display:block}
.cvr ul{position:absolute;left:4cqw;top:4cqw;margin:0;padding:0;list-style:none;font-family:var(--display);font-style:italic;font-size:max(13px,1.7cqw);line-height:1.6}
.cvr h1{position:absolute;left:4cqw;bottom:4cqw;margin:0;font-size:10.4cqw;font-weight:900;line-height:.9;letter-spacing:-.03em;color:#fff}
.cvr h1 span{color:#DCE6FF}
@media (max-width:760px){
  .cvr .k{width:90cqw;left:30cqw;top:-34cqw}
  .cvr .p{width:60cqw;left:60cqw;top:auto;bottom:-22cqw}
  .cvr .r{width:78cqw;left:11cqw;top:auto;bottom:auto;margin-top:0;top:34cqw}
  .cvr .lg{width:58cqw;left:21cqw;top:44cqw}
  .cvr h1{font-size:17cqw}
  .cvr ul{font-size:15px}
}
/* vision */
.v1{background:var(--blue);color:#fff}.v1 h2{font-size:clamp(44px,8vw,112px);font-weight:900}
.v2 h2{font-size:clamp(44px,8vw,112px);font-weight:900;color:var(--blueink)}
.v1 p,.v2 p{font-size:clamp(13px,1.3vw,17px);max-width:44ch}
/* wide */
.page.wide{display:flex;flex-direction:column}
.wide>header{padding:clamp(18px,3vw,38px) clamp(18px,3.4vw,46px) clamp(8px,1.2vw,16px);border-bottom:2px solid var(--rule);margin:0 clamp(18px,3.4vw,46px) clamp(10px,1.6vw,20px);padding-left:0;padding-right:0}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:0 clamp(18px,3.4vw,46px) clamp(20px,2.6vw,34px);min-height:0;flex:1}
.trio>div{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0;padding:0 clamp(10px,1.6vw,22px);border-left:1px solid var(--rule);overflow:auto}
.trio>div:first-child{border-left:0;padding-left:0}.trio>div:last-child{padding-right:0}
.trio.two{grid-template-columns:repeat(2,1fr)}
.trio .shot{width:100%;flex:1;min-height:0;object-fit:contain;object-position:top}
.team .shot{aspect-ratio:3/4;flex:none;max-height:76%;object-fit:cover;object-position:center 25%;width:auto;max-width:100%}
.svc small{display:block;border-left:3px solid var(--blue);padding-left:10px;font-family:var(--display);font-style:italic;font-size:clamp(12px,1.1vw,15px);line-height:1.45;color:var(--muted)}
.svc small b{font-style:normal;font-family:var(--body);font-size:11px;color:var(--blueink);display:block;margin-bottom:2px;letter-spacing:.06em}
/* collab / process / contact */
.blue{background:var(--blue);color:#fff;align-items:center;text-align:center}
.blue h2{font-size:clamp(40px,7vw,100px);font-weight:900}
.card{background:#fff;padding:10px;width:100%;max-height:72%;object-fit:contain;border:1px solid #ddd}
.tbl{display:flex;flex-direction:column;border-top:2px solid var(--rule)}
.tbl div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:clamp(12px,1.1vw,15px)}
.tbl i{display:inline-block;width:10px;height:10px;margin-right:8px}
.tbl b{font-family:var(--display);font-size:1.25em}
svg.pie{width:min(100%,420px);height:auto;align-self:center}
.links a{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule);padding:10px 0;font-family:var(--display);font-size:clamp(15px,1.8vw,24px);font-weight:500}
.links a span{font-family:var(--body);font-size:12px;color:var(--muted)}
.links a:hover{color:var(--blueink)}
.nav{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:14px}
.nav button{background:transparent;border:1px solid var(--ink);color:var(--ink);width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer}
.nav button:hover:not(:disabled){background:var(--blue);color:#fff;border-color:var(--blue)}
.nav button:disabled{opacity:.3;cursor:default}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (max-width:760px){
  body{overflow:auto;justify-content:flex-start;padding:14px 0}
  .book{aspect-ratio:auto;height:78vh;height:78svh}
  .page,.page.wide{display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
  .cover{display:block;overflow:hidden}
  .ph{min-height:240px;flex:none}
  .col{overflow:visible;flex:none}
  .trio,.trio.two{grid-template-columns:1fr;flex:none;gap:18px}
  .trio>div{border-left:0;padding:0;overflow:visible}
  .trio .shot{flex:none;height:auto}
  .team .shot{width:65%;max-height:none}
  .blue{min-height:200px}
}
@media (prefers-reduced-motion:reduce){.page{transition:opacity .2s}}
</style>
</head>
<body>
<main class="book" id="book" aria-label="Company profile Chrysanths"></main>
<nav class="nav" aria-label="Navigasi halaman">
  <button id="prev" aria-label="Halaman sebelumnya">‹</button>
  <span id="count">1 / 1</span>
  <button id="next" aria-label="Halaman berikutnya">›</button>
</nav>
<script>
const IMG={logo:"assets/logo.jpg",office:"assets/office.jpg",contact:"assets/contact.jpg",ezra:"assets/ezra.jpg",nata:"assets/nata.jpg",steven:"assets/steven.jpg",collab:"assets/collab.jpg",p1a:"assets/p1a.jpg",p1b:"assets/p1b.jpg",p1c:"assets/p1c.jpg",p2a:"assets/p2a.jpg",p2b:"assets/p2b.jpg",p2c:"assets/p2c.jpg"};
const ph=(k,alt)=>`<div class="ph"><img src="${IMG[k]}" alt="${alt}"></div>`;
const pages=[];

pages.push(`<section class="page cvr" aria-label="Sampul"><i class="c k"></i><i class="c p"></i><i class="c r"></i><span class="c lg"><img src="${IMG.logo}" alt="Logo Chrysanths"></span><ul><li>Meet the Team</li><li>Our Services</li><li>Collaborated With</li><li>Slight of Portofolio</li></ul><h1>The<br>Company<br><span>Profile</span></h1></section>`);

pages.push(`<section class="page" aria-label="About Company">${ph("office","Kantor Chrysanths")}<div class="col"><h2>About Company</h2>
<p class="drop">Chrysanthindo lahir dari sebuah realitas di industri F&amp;B: banyak pengusaha memiliki produk yang luar biasa, namun tersembunyi di lokasi yang tidak strategis. Berawal sebagai konsultan F&amp;B konvensional, pendiri kami, Ezra Dwi Noveandis, menyadari bahwa tantangan terbesar klien bukanlah sekadar operasional, melainkan visibilitas.</p>
<p>Di era digital, lokasi fisik bukan lagi batasan. Kami percaya bahwa konten yang tepat adalah “lokasi strategis” baru. Chrysanthindo bertransformasi menjadi mitra strategis yang menitikberatkan pada kekuatan digital marketing untuk membawa audiens langsung ke pintu bisnis Anda, di mana pun koordinatnya berada.</p>
<p>Dengan dukungan jaringan ratusan Key Opinion Leaders (KOL) dan pemahaman mendalam tentang behavioral analysis, kami membantu brand F&amp;B bertumbuh dari “tidak terlihat” menjadi “viral dan berkelanjutan.”</p></div></section>`);

pages.push(`<section class="page" aria-label="Vision dan Mission"><div class="col v1"><h2>Vision</h2><p>Memberikan solusi pemasaran digital yang inovatif dan efektif melalui sosial media. Mentransformasi cara bisnis berinteraksi dengan konsumen di era digital, dengan menghadirkan solusi pemasaran yang kreatif dan efektif, sehingga meningkatkan penjualan dan brand awareness.</p></div>
<div class="col v2"><h2>Mission</h2><p>Mendorong transformasi digital industri di Indonesia dengan menghadirkan solusi pemasaran yang efektif dan efisien melalui konten di sosial media, dan meningkatkan daya saing bisnis lokal.</p></div></section>`);

const member=(k,n,r)=>`<div><img class="shot" src="${IMG[k]}" alt="${n}"><h3>${n}</h3><p class="fine">${r}</p></div>`;
pages.push(`<section class="page wide" aria-label="Meet the Team"><header><h2>Meet the Team</h2></header><div class="trio team">${member("ezra","Ezra Dwi","Founder &amp; Head of Creative")}${member("nata","Chef Nata","Head of KOL Management")}${member("steven","Steven","Head of Management Event")}</div></section>`);

const svc=(t,d,k)=>`<div class="svc"><h3>${t}</h3><p>${d}</p><small><b>Key Focus</b>${k}</small></div>`;
pages.push(`<section class="page wide" aria-label="Our Services 1"><header><h2>Our Services</h2></header><div class="trio">
${svc("Talent and Endorsement","Kami memahami bahwa pengaruh (influence) lebih kuat daripada sekadar jumlah pengikut. Kami mengkurasi talent melalui behavioral profiling untuk memastikan persona mereka selaras dengan brand identity Anda.","Riset mendalam terhadap kredibilitas talent, negosiasi kontrak, hingga pengawasan output kreatif agar pesan brand tersampaikan secara organik dan berdampak pada konversi.")}
${svc("Social Media Management","Kami membangun ekosistem digital. Menggunakan pendekatan content pillars yang strategis dan analisis tren terkini, kami memastikan setiap konten memiliki tujuan yang jelas.","Content planning, copywriting berbasis psikologi hook, desain visual/layout, community management, serta laporan performa bulanan yang berbasis data (bukan sekadar angka vanity).")}
${svc("Documentation for Social Media","Kami menyediakan layanan dokumentasi (foto &amp; video) yang dirancang khusus untuk algoritma media sosial—mulai dari konten talking head yang edukatif hingga sinematik untuk konten di social media.","Videografi vertikal, editing cepat untuk tren sosial, behind-the-scene yang autentik, dan konten profil profesional untuk membangun otoritas brand.")}</div></section>`);

pages.push(`<section class="page wide" aria-label="Our Services 2"><header><h2>Our Services</h2></header><div class="trio two">
${svc("Corporate Training &amp; Workshop","Tingkatkan kapasitas tim internal Anda. Jika Anda sudah memiliki tim marketing namun butuh penyegaran strategi, kami hadir untuk mentransformasi cara kerja mereka. Kami membawa standar industri dan tren terbaru langsung ke kantor Anda.","Agar tim Anda mampu memproduksi konten berkualitas secara mandiri dengan standar agensi, mulai dari psikologi hook hingga teknik editing profesional.")}
${svc("Event Organizing","Membawa pengalaman digital ke dunia nyata. Kami membantu brand menciptakan momen yang tak terlupakan melalui aktivasi offline. Baik itu peluncuran produk, workshop edukasi, atau gathering komunitas, kami memastikan setiap sudut acara bersifat Instagrammable dan mendorong audiens untuk berbagi secara sukarela.","Konsep acara kreatif, pengelolaan teknis di lapangan, koordinasi media/influencer, dan memastikan awareness acara meledak di media sosial.")}</div></section>`);

pages.push(`<section class="page" aria-label="Collaborated With"><div class="col"><h2>Collaborated With</h2><img class="card" src="${IMG.collab}" alt="Logo klien: Bumi Surabaya, Ascent, Etira, Mie Sedaap, Delta Foods, Tristar, Ofero, Domino’s, Kopi Enam Hari, Momoyo, Nogo Joyo, Tomoro Coffee, Verwood, Mustika Yogyakarta, Aloft Hotels, Ben Ramen"></div><div class="col blue"><h2>And many more</h2></div></section>`);

const C=[["Endorsement",55.6,"#0050F0"],["Social media management",6.9,"#111111"],["Documentation",20.8,"#7FA6FF"],["Paid ads",4.2,"#8A8A85"],["Class / training",9.7,"#B9CCFF"],["Event organizing",2.8,"#D6D6D0"]];
let a0=-Math.PI/2,sl="";
C.forEach(c=>{const a1=a0+c[1]/100*2*Math.PI,x0=100+95*Math.cos(a0),y0=100+95*Math.sin(a0),x1=100+95*Math.cos(a1),y1=100+95*Math.sin(a1);sl+=`<path d="M100 100L${x0} ${y0}A95 95 0 ${c[1]>50?1:0} 1 ${x1} ${y1}Z" fill="${c[2]}" stroke="#fff" stroke-width="1.2"/>`;a0=a1});
pages.push(`<section class="page" aria-label="Business Process"><div class="col"><h2>Business Process</h2><div class="tbl">${C.map(c=>`<div><span><i style="background:${c[2]}"></i>${c[0]}</span><b>${c[1]}%</b></div>`).join("")}</div></div><div class="col"><svg class="pie" viewBox="0 0 200 200" role="img" aria-label="Diagram lingkaran: Endorsement 55,6%, Documentation 20,8%, Class/training 9,7%, Social media management 6,9%, Paid ads 4,2%, Event organizing 2,8%">${sl}</svg></div></section>`);

const port=(h,items)=>`<section class="page wide" aria-label="${h}"><header><h2>Slight of Portofolio</h2></header><div class="trio">${items.map(i=>`<div><img class="shot" src="${IMG[i[0]]}" alt="${i[1]}"><h3>${i[1]}</h3></div>`).join("")}</div></section>`;
pages.push(port("Portofolio 1",[["p1a","MG Mimosa Jemursari"],["p1b","Verwood Hotel"],["p1c","Bumi Surabaya City Resort"]]));
pages.push(port("Portofolio 2",[["p2a","Kompak Kopi"],["p2b","Ben Ramen"],["p2c","Ascent Group"]]));

pages.push(`<section class="page" aria-label="Contact Information"><div class="col"><h2>Contact Information</h2><p class="fine" style="font-size:clamp(16px,2vw,26px);line-height:1.2">Let’s Connect With Us!</p>
<div class="links"><a href="tel:+6285157676030"><span>telepon</span>0851-5767-6030</a><a href="mailto:chrysanthindo@gmail.com"><span>email</span>chrysanthindo@gmail.com</a><a href="https://instagram.com/chrysanthindo" target="_blank" rel="noopener"><span>instagram</span>@chrysanthindo</a><a href="https://instagram.com/chrysantmedia" target="_blank" rel="noopener"><span>instagram</span>@chrysantmedia</a></div></div>${ph("contact","Tim Chrysanths")}</section>`);

const book=document.getElementById("book"),prev=document.getElementById("prev"),next=document.getElementById("next"),count=document.getElementById("count");
book.innerHTML=pages.join("");
const els=[...book.children];let cur=0;
els.forEach((e,i)=>{e.style.zIndex=els.length-i;if(i)e.insertAdjacentHTML("beforeend",`<span class="folio">Chrysanths&nbsp; ${String(i+1).padStart(2,"0")}</span>`)});
function show(){els.forEach((e,i)=>{e.classList.toggle("flipped",i<cur);e.setAttribute("aria-hidden",i!==cur)});prev.disabled=cur===0;next.disabled=cur===els.length-1;count.textContent=(cur+1)+" / "+els.length}
const go=d=>{cur=Math.max(0,Math.min(els.length-1,cur+d));show()};
prev.onclick=()=>go(-1);next.onclick=()=>go(1);
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
let sx=null;
book.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
book.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70)go(dx<0?1:-1);sx=null});
show();
</script>
</body>
</html>
